{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: xdevops-training
  labels: {app.kubernetes.io/part-of: xdevops-training}
spec:
  selector:
    matchExpressions:
      - {key: app, operator: In, values: [customer-api, orders-api, payments-api, inventory-api]}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
