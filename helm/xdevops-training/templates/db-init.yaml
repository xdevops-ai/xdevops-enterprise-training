apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xdevops-training.fullname" . }}-db-init
  labels: {app.kubernetes.io/part-of: xdevops-training}
data:
  init.sql: |
    \set ON_ERROR_STOP on
    CREATE TABLE IF NOT EXISTS customers (
      id integer PRIMARY KEY,
      name text NOT NULL,
      tier text NOT NULL
    );
    CREATE TABLE IF NOT EXISTS orders (
      id uuid PRIMARY KEY,
      customer_id integer NOT NULL,
      sku text NOT NULL,
      quantity integer NOT NULL,
      amount numeric(12,2) NOT NULL,
      created_at timestamptz NOT NULL DEFAULT now()
    );
    INSERT INTO customers(id,name,tier)
    SELECT i, 'Customer ' || i, CASE WHEN i % 5 = 0 THEN 'gold' ELSE 'standard' END
    FROM generate_series(1,20) AS s(i)
    ON CONFLICT (id) DO NOTHING;

    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
    SELECT format('ALTER ROLE %I PASSWORD %L', :'app_user', :'app_password') \gexec
    REVOKE CONNECT ON DATABASE :"DBNAME" FROM PUBLIC;
    GRANT CONNECT ON DATABASE :"DBNAME" TO :"app_user";
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    GRANT USAGE ON SCHEMA public TO :"app_user";
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :"app_user";
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO :"app_user";
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"app_user";
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO :"app_user";
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "xdevops-training.fullname" . }}-db-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: {app: db-init, app.kubernetes.io/part-of: xdevops-training}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: psql
          image: {{ include "xdevops-training.image" (list . "db-bootstrap") | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: PGHOST
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.adminSecret }}, key: host}}
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.adminSecret }}, key: database}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.adminSecret }}, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.adminSecret }}, key: password}}
            - name: APP_DB_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.adminSecret }}, key: app-username}}
            - name: APP_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.adminSecret }}, key: app-password}}
            - name: PGSSLMODE
              value: verify-full
          command:
            - sh
            - -ceu
            - |
              psql -v ON_ERROR_STOP=1 -v app_user="$APP_DB_USER" -v app_password="$APP_DB_PASSWORD" -f /sql/init.sql
          volumeMounts:
            - {name: sql, mountPath: /sql, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: sql
          configMap:
            name: {{ include "xdevops-training.fullname" . }}-db-init
